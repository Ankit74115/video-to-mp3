# No host rule: the same ingress answers on localhost, a tunnel hostname or a public IP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trackbay
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
