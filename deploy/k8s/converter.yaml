apiVersion: apps/v1
kind: Deployment
metadata:
  name: converter
spec:
  # Scale this to convert several videos at once; RabbitMQ hands each worker one job.
  replicas: 1
  selector:
    matchLabels:
      app: converter
  template:
    metadata:
      labels:
        app: converter
    spec:
      enableServiceLinks: false
      # Let an in-flight ffmpeg run finish before the pod is killed on rollout.
      terminationGracePeriodSeconds: 120
      containers:
        - name: converter
          image: trackbay/converter
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: trackbay-config
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: trackbay-secrets
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 2Gi
